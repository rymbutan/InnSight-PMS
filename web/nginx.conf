# Static server for the built SPA. Dropped into /etc/nginx/conf.d/default.conf.
#
# This container is NOT the browser's entry point — the gateway is. The gateway
# proxies `/` here and handles `/api/*` itself, so the browser only ever talks to
# one origin. That is what makes the rate limiter work: it keys on the real client
# IP instead of on the single IP of whatever container was proxying (see
# services/gateway/nginx.conf).
#
# Consequence: no /api proxying here, and no CORS concerns.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Belt and braces — the gateway strips these too, but this container's port
    # is not published, so anything reaching it came from inside the network.
    server_tokens off;

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3D models. These are NOT content-hashed (they live in public/ and are served
    # verbatim), so they must be revalidated rather than cached forever — swapping
    # a .glb keeps its filename. etag + a short max-age gives 304s on repeat loads
    # without pinning a stale 40 MB model in the browser cache.
    #
    # sendfile/tcp_nopush are inherited from the base config; the individual files
    # run 8–60 MB, so range requests matter for seeking/aborted loads.
    location /models/ {
        # nginx's bundled mime.types has no .glb entry, so these were served as
        # application/octet-stream. GLTFLoader reads them as an ArrayBuffer either
        # way, but the correct type matters for caching proxies and diagnostics.
        #
        # `default_type` rather than a `types { }` block on purpose: in server or
        # location context `types` REPLACES the inherited mime map rather than
        # extending it, which would leave CSS and JS untyped.
        default_type model/gltf-binary;

        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Accept-Ranges bytes;
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients pinned to the
    # old asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # SPA history fallback: react-router owns every other path, so an unknown URL
    # is a client-side route, not a 404. Without this, a hard refresh on
    # /reservations/42 returns nginx's 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    # .glb is already-compressed binary at this size; gzipping it burns CPU for
    # ~nothing. Phase 3 replaces these with Draco/meshopt-compressed models.
}
