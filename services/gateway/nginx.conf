worker_processes auto;

# Each open SSE stream is a connection held for as long as the tab is open, and a
# connection to an upstream costs a second descriptor. The container's default
# RLIMIT_NOFILE (1024 on many hosts) was the real ceiling regardless of what
# worker_connections claimed, so raise both.
worker_rlimit_nofile 16384;
events { worker_connections 4096; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # $uri, NOT $request. `"$request"` is the full request line INCLUDING the query
    # string, so every SSE connect wrote its ?token=<12h JWT> into this log — and
    # logs get shipped, tailed, and pasted into bug reports. $uri is the normalised
    # path with the query string dropped. Referer is kept but is not a credential
    # carrier here; if that changes, drop it too.
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # A rejected request is 429 Too Many Requests, not 503 Service Unavailable.
    # 503 was actively misleading: web/src/api.js rendered it as "Cannot reach the
    # backend (gateway). Is `docker compose up` running?", so a rate-limited login
    # looked like the whole stack was down.
    limit_req_status 429;
    limit_conn_status 429;

    # Docker's embedded DNS. Used to RE-RESOLVE upstream hostnames at runtime
    # (valid=10s) so recreating a backend container — which gives it a new IP —
    # doesn't leave the gateway proxying to a stale IP (the old static
    # `upstream {}` blocks resolved once at startup and 502'd until a restart).
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # CORS allowlist — only echo Access-Control-Allow-Origin if the request
    # origin matches one of these. Echoing $http_origin unconditionally is
    # effectively the same as "*" with credentials, which is unsafe.
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:\d+)?$"     $http_origin;
        "~^https?://127\.0\.0\.1(:\d+)?$"  $http_origin;
        "~^https://(www\.)?innsight\.tech$" $http_origin;
    }

    # ── Rate limiting ────────────────────────────────────────────────────────
    #
    # These limits used to be hotel-wide rather than per-user, for two reasons
    # that have both now been removed:
    #
    #  1. The browser talked to the Vite dev server, which proxied /api onward.
    #     So every request arrived at this gateway from ONE source address — the
    #     `web` container — and `$binary_remote_addr` was that container's IP for
    #     the entire hotel. 10 logins/min shared by everyone; the 6th concurrent
    #     login got rejected.
    #     Fixed structurally: the gateway is now the browser's only origin (it
    #     serves the SPA at `location /`), so $remote_addr IS the client. No
    #     X-Forwarded-For trust chain to get wrong.
    #
    #  2. The limit applied at server level, so loading the app — HTML, JS chunks,
    #     and up to 20 large .glb models — spent the same budget as API calls.
    #     Fixed below with an empty-key map: nginx skips limit_req entirely when
    #     the key evaluates to "", so static requests are not counted at all.
    #
    # A NAT'd computer lab still shares one address, so the ceilings are also
    # sized for a full class rather than for one user, and `delay=` throttles the
    # overflow instead of rejecting it outright.
    # A browser navigating to a URL sends `Accept: text/html,...`; curl, CI probes
    # and monitoring do not. Used by `location = /health`, which has to be both the
    # gateway's health endpoint and the app's Health page.
    map $http_accept $wants_html {
        default   0;
        "~*text/html"  1;
    }

    map $uri $api_limit_key {
        default   "";               # empty key ⇒ request is not rate limited
        ~^/api/   $binary_remote_addr;
    }
    map $uri $login_limit_key {
        default              "";
        ~^/api/auth/login    $binary_remote_addr;
    }

    # 50 r/s sustained per client address. A Dashboard reload is 8 requests and a
    # Calendar reload is 4, so this is ~6 dashboards/second from a single IP.
    # burst=300 absorbs a lab full of tabs reloading at once; the 150 beyond
    # `delay` are throttled to the sustained rate rather than 429'd.
    limit_req_zone $api_limit_key zone=api_zone:10m rate=3000r/m;

    # Login stays deliberately tight — this is the brute-force control, and it
    # backs up the per-account lockout in the auth service (5 failures). 2 r/s
    # per address, 40 queued. A class of 40 signing in together all succeed,
    # spread over ~20s; a credential-stuffing run gets throttled to a crawl.
    limit_req_zone $login_limit_key zone=auth_zone:10m rate=120r/m;

    # Long-lived SSE streams are capped separately: they are not "requests per
    # second", they are held connections, and one runaway client reconnecting in
    # a loop could otherwise exhaust worker_connections. 24 = a dozen tabs each
    # holding both streams.
    limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

    server {
        listen 8080;
        server_name _;

        # Upstream targets as variables so proxy_pass uses the resolver above
        # and re-resolves the container IP per request (honoring valid=10s),
        # instead of caching it once at startup like an `upstream {}` block.
        set $up_auth        auth-service:3010;
        set $up_reservation reservation-service:3011;
        set $up_stay        stay-service:3006;
        set $up_folio       folio-service:3007;
        set $up_guest       guest-service:3008;
        set $up_maintenance maintenance-service:3009;
        set $up_inventory   inventory-service:3005;
        set $up_audit       audit-service:3012;
        set $up_reports     reports-service:3013;
        set $up_web         web:8080;

        # Don't advertise the nginx version on error pages / Server headers.
        server_tokens off;

        # ── Security headers (finding S6) ────────────────────────────────────
        # nginx set NONE of these. `always` so they are present on error
        # responses too, which is where a missing X-Content-Type-Options bites.
        #
        # HSTS is deliberately COMMENTED OUT: this stack listens on plain :8080
        # with no TLS, and sending Strict-Transport-Security over http would pin
        # browsers to an https origin that does not exist yet — locking users out.
        # Uncomment it the moment TLS terminates here.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # CSP. `unsafe-inline` for styles is required because the app sets inline
        # `style=` attributes throughout; scripts do NOT need it, so script-src
        # stays strict. blob: is needed for the 3D models and the PDF downloads
        # (both create object URLs), and connect-src 'self' covers the SSE stream.
        #
        # `'wasm-unsafe-eval'` is REQUIRED, not a loosening for convenience. Every
        # shipped .glb is EXT_meshopt_compression, and the meshopt decoder is a
        # WebAssembly module instantiated at runtime. Under a bare `script-src 'self'`
        # the browser blocks WebAssembly.instantiate() outright, so EVERY model fails
        # to decode — the training sim and the layout editor both render an empty room
        # with no visible cause but a console error. This directive permits WASM
        # compilation ONLY; it does not permit eval() of strings, which is what
        # 'unsafe-eval' would do. Do not "tighten" it back to plain 'self'.
        #
        # `connect-src` must include `blob:` for the same reason, and it is NOT
        # obvious: GLTFLoader unpacks each embedded WebP texture into a Blob and
        # loads it through ImageBitmapLoader, which uses fetch() — so the blob URL
        # is a *connect-src* fetch, not an img-src load. With `connect-src 'self'`
        # alone every texture fails with "THREE.GLTFLoader: Couldn't load texture
        # blob:…" while geometry still loads, i.e. an untextured room. img-src
        # blob: does not cover this; both are required.
        # Google Identity Services (university sign-in) needs three extra grants:
        # its client script, the iframe it renders the button/One-Tap in, and
        # XHR back to accounts.google.com. googleusercontent is the avatar host.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' blob: https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # CORS — gateway answers preflight, services don't need to.
        # Allowlist via $cors_origin map (empty header for unknown origins).
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type,Idempotency-Key,X-Request-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        # General API rate limit. Declared at server level so every /api location
        # inherits it, but the $api_limit_key map above yields an empty key for
        # non-/api URIs, so serving the SPA and its models costs nothing here.
        limit_req zone=api_zone burst=300 delay=150;

        # Gateway health — AND the app's own Health page, which lives at the same
        # path. `location = /health` used to answer JSON unconditionally, so a
        # deep link or a hard refresh on the in-app Health screen showed the raw
        # gateway payload instead of the page; only in-app navigation (client-side
        # routing, no request) reached it.
        #
        # Split on what the caller asked for: a browser navigation sends
        # `Accept: text/html`, so it falls through to the SPA; CI's
        # `curl -fs http://localhost:8080/health` (.github/workflows/ci.yml) and
        # any monitor still get the JSON. `rewrite ... last` is internal — the
        # address bar keeps saying /health, which is what react-router reads.
        #
        # `return` and `rewrite` are the two directives that are actually safe
        # inside `if` in a location; proxy_pass here would not be.
        location = /health {
            if ($wants_html) { rewrite ^ /index.html last; }
            default_type application/json;
            return 200 '{"service":"gateway","status":"healthy"}';
        }

        # Per-service docs (Swagger UI). Path becomes /docs/<service>/...
        location /docs/auth/         { rewrite ^/docs/auth/(.*)$ /docs/$1 break;        proxy_pass http://$up_auth; }
        location /docs/inventory/    { rewrite ^/docs/inventory/(.*)$ /docs/$1 break;   proxy_pass http://$up_inventory; }
        location /docs/stay/         { rewrite ^/docs/stay/(.*)$ /docs/$1 break;        proxy_pass http://$up_stay; }
        location /docs/folio/        { rewrite ^/docs/folio/(.*)$ /docs/$1 break;       proxy_pass http://$up_folio; }
        location /docs/guest/        { rewrite ^/docs/guest/(.*)$ /docs/$1 break;       proxy_pass http://$up_guest; }
        location /docs/maintenance/  { rewrite ^/docs/maintenance/(.*)$ /docs/$1 break; proxy_pass http://$up_maintenance; }
        location /docs/reservation/  { rewrite ^/docs/reservation/(.*)$ /docs/$1 break; proxy_pass http://$up_reservation; }
        location /docs/audit/        { rewrite ^/docs/audit/(.*)$ /docs/$1 break;       proxy_pass http://$up_audit; }
        location /docs/reports/      { rewrite ^/docs/reports/(.*)$ /docs/$1 break;     proxy_pass http://$up_reports; }
        # Aggregated landing page redirects to auth docs
        location = /docs { return 302 /docs/auth/; }

        # Auth service — stricter rate limit to slow brute-force attacks.
        # `delay=10`: the first 10 attempts from an address go straight through,
        # the next 30 are throttled to the 2 r/s zone rate, and only past 40
        # queued does a client get 429. Legitimate simultaneous sign-ins wait;
        # only a genuine flood is refused.
        location /api/auth/login  {
            limit_req zone=auth_zone burst=40 delay=10;
            proxy_pass http://$up_auth;
        }
        # Same zone as /login: this is the other way to obtain a session token.
        location /api/auth/google {
            limit_req zone=auth_zone burst=40 delay=10;
            proxy_pass http://$up_auth;
        }
        # Public and unauthenticated by necessity — anyone can ask for an account.
        # Tighter than sign-in: a person submits this once, not forty times.
        location /api/auth/access-request {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://$up_auth;
        }
        # Public by necessity, and it SENDS MAIL — the one unauthenticated endpoint
        # that costs something downstream on every hit. The service also throttles
        # per account, which is what stops a flood aimed at one person's inbox;
        # this stops a flood aimed at the mail hop.
        location /api/auth/forgot-password {
            limit_req zone=auth_zone burst=5 nodelay;
            proxy_pass http://$up_auth;
        }
        # Redeeming a link is already a 256-bit token lookup, but limiting it turns
        # brute force from impractical into pointless.
        location /api/auth/reset-password {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://$up_auth;
        }
        location /api/auth/       { proxy_pass http://$up_auth; }
        location /api/users       { proxy_pass http://$up_auth; }
        location /api/access-requests { proxy_pass http://$up_auth; }
        location /api/room-layouts { proxy_pass http://$up_auth; }
        # Uploaded .glb fixtures. Its own body limit because the server accepts
        # up to 24MB per model and the global cap here is 20m — without this the
        # gateway would reject a legal upload with a bare 413 before the service
        # ever saw it, and the editor would report a failure the API never made.
        # `request_buffering off` streams the body through instead of spooling
        # the whole model to disk first.
        location /api/room-assets {
            client_max_body_size 25m;
            proxy_request_buffering off;
            proxy_pass http://$up_auth;
        }
        location /api/roles       { proxy_pass http://$up_auth; }
        location /api/permissions { proxy_pass http://$up_auth; }
        location /api/training    { proxy_pass http://$up_auth; }
        location /api/health/     { proxy_pass http://$up_auth; }

        # Reservation
        location /api/reservations { proxy_pass http://$up_reservation; }
        # Hotel-wide settings (currently the add-on surcharge) live on the
        # reservation service: `app.use('/api', ...)` + `router.get('/settings/
        # addon-fee-percent')`. There was no location for them at all, so both the
        # read on the New Reservation page and the admin's write 404'd at the
        # gateway and never reached the service — the surcharge silently sat on
        # its default and could not be changed.
        # Tax rates and hotel identity live on the FOLIO service — posting a
        # charge must not depend on the reservation service being reachable.
        # nginx resolves prefix locations longest-match-first, so these win over
        # the /api/settings catch-all below without disturbing the add-on
        # surcharge and theme routes behind it.
        location /api/settings/tax-rates           { proxy_pass http://$up_folio; }
        location /api/settings/hotel               { proxy_pass http://$up_folio; }
        location /api/settings/payment-fee-percent { proxy_pass http://$up_folio; }
        # Sidebar Visibility is authorisation config, so the auth service owns it
        # — same reason its durable row lives in the auth database. Listed above
        # the catch-all for the same reason the folio settings are.
        location /api/settings/nav-visibility      { proxy_pass http://$up_auth; }
        location /api/settings/my-sections         { proxy_pass http://$up_auth; }
        location /api/settings                     { proxy_pass http://$up_reservation; }

        # Public-facing endpoints (no auth required) — used by /book and /portal.
        # The services expose these routes BEFORE their verifyToken middleware,
        # so we just proxy through with the path intact.
        location = /api/public/availability { proxy_pass http://$up_inventory; }
        location ~ ^/api/public/promo/       { proxy_pass http://$up_inventory; }
        location /api/promo-codes            { proxy_pass http://$up_inventory; }
        # The simulated desk → housekeeping phone line. Inventory owns it because
        # it owns both the room record and the SSE bridge the ring travels down.
        location /api/housekeeping-calls     { proxy_pass http://$up_inventory; }
        location ~ ^/api/public/reservations { proxy_pass http://$up_reservation; }
        # Simulated QR wallet payments. Unauthenticated by design — opened by
        # whatever scanned the code — and gated by a single-use token instead.
        location ~ ^/api/public/payment-intents { proxy_pass http://$up_folio; }
        # The folio's own QR code, printed on the guest bill. Same pattern: the
        # token is the credential, not a session.
        location ~ ^/api/public/folios          { proxy_pass http://$up_folio; }

        # Stay
        location /api/arrivals    { proxy_pass http://$up_stay; }
        location /api/departures  { proxy_pass http://$up_stay; }
        location /api/in-house    { proxy_pass http://$up_stay; }
        location /api/check-in    { proxy_pass http://$up_stay; }
        location /api/check-out/  { proxy_pass http://$up_stay; }
        location /api/walk-in     { proxy_pass http://$up_stay; }
        location /api/no-show/    { proxy_pass http://$up_stay; }
        location /api/stays       { proxy_pass http://$up_stay; }

        # Folio
        location /api/folios          { proxy_pass http://$up_folio; }
        location /api/charge-codes    { proxy_pass http://$up_folio; }
        location /api/payment-methods { proxy_pass http://$up_folio; }
        location /api/payment-disputes { proxy_pass http://$up_folio; }

        # Guest
        location /api/guests  { proxy_pass http://$up_guest; }
        location /api/loyalty { proxy_pass http://$up_guest; }

        # Maintenance
        location /api/work-orders { proxy_pass http://$up_maintenance; }
        location /api/assets      { proxy_pass http://$up_maintenance; }
        location /api/parts       { proxy_pass http://$up_maintenance; }

        # Inventory
        # SSE streams — exact matches win over the /api/rooms prefix below.
        # Buffering must be off or events stall in nginx.
        #   /api/rooms/events — live housekeeping map (room status only)
        #   /api/events       — all cross-module events (dashboard live refresh)
        # Mint a single-use SSE ticket. A NORMAL request (not a stream), so it gets
        # the usual buffering and the api_zone rate limit — deliberately, since it is
        # also the thing an attacker would hammer to farm tickets.
        location = /api/events/ticket {
            proxy_pass http://$up_inventory;
        }

        location = /api/rooms/events {
            limit_conn sse_conn 24;
            proxy_pass http://$up_inventory;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
        location = /api/events {
            limit_conn sse_conn 24;
            proxy_pass http://$up_inventory;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }
        location /api/availability      { proxy_pass http://$up_inventory; }
        location /api/holds             { proxy_pass http://$up_inventory; }
        location /api/rooms             { proxy_pass http://$up_inventory; }
        location /api/room-types        { proxy_pass http://$up_inventory; }
        location /api/rate-plans        { proxy_pass http://$up_inventory; }
        location /api/facilities        { proxy_pass http://$up_inventory; }
        location /api/facility-bookings { proxy_pass http://$up_inventory; }

        # Audit + Reports
        location /api/audit   { proxy_pass http://$up_audit; }
        location /api/reports { proxy_pass http://$up_reports; }

        # Anything under /api that no location above claims is a genuine 404 —
        # keep the JSON shape the frontend's error handling expects, rather than
        # letting it fall through to the SPA and hand an API caller back HTML.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"Not found at gateway."}';
        }

        # ── The SPA ──────────────────────────────────────────────────────────
        # Everything else is the frontend, served by the `web` container (nginx
        # over the built `dist`; the history fallback lives there). Previously
        # this location returned `404 {"error":"Not found at gateway."}` and the
        # browser instead loaded the app straight off the Vite dev server on a
        # different port — which is what made the rate limiter hotel-wide.
        #
        # Routing the app through the gateway means one browser-facing origin:
        # no CORS, no port juggling, and $remote_addr is the real client.
        location / {
            proxy_pass http://$up_web;

            # Models run 8–60 MB. Buffering them would spool each response to a
            # temp file before a single byte reached the browser; stream instead.
            proxy_buffering off;
            proxy_request_buffering off;

            # Let the browser resume/seek large model downloads.
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_read_timeout 300s;
        }
    }
}
